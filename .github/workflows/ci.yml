name: CI

on:
  push:
    branches: [main, develop, 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────
  # 1. Backend — migrations + API tests against real Postgres
  # ─────────────────────────────────────────
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plxyground
          POSTGRES_PASSWORD: plxyground
          POSTGRES_DB: plxyground_test
        ports:
          - 5432:5432
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://plxyground:plxyground@localhost:5432/plxyground_test
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars!!
      CORS_ORIGIN: http://localhost:3012
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        working-directory: backend
        run: |
          npm ci
          npm install --no-save jest@29 supertest@7 pg@8

      - name: Syntax check
        working-directory: backend
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run migrations
        working-directory: backend
        run: node src/db/migrate.js

      - name: Run tests
        working-directory: backend
        run: npm test

  # ─────────────────────────────────────────
  # 2. Mobile app — dependency install + Expo health check
  # ─────────────────────────────────────────
  frontend:
    name: Frontend (Expo)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Expo doctor (informational)
        working-directory: frontend
        run: npx expo-doctor@latest || true

  # ─────────────────────────────────────────
  # 3. Admin panel — syntax check
  # ─────────────────────────────────────────
  admin:
    name: Admin Panel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install deps
        working-directory: admin-panel
        run: npm ci

      - name: Syntax check server.js
        working-directory: admin-panel
        run: node --check server.js
